<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAG</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>MAG</h1>
            <p class="subtitle">Conversation Knowledge Workspace v1.2.1</p>

        </header>

        <section class="panel">

            <h2>CKI Import</h2>

            <textarea
                id="jsonInput"
                placeholder="Ide illeszd be a teljes CKI Export JSON-t..."></textarea>

            <div class="button-row">

                               <button id="previewBtn">
                                    Preview
                                </button>
                                
                                <button id="saveBtn">
                                    Save
                                </button>
                                
                                <button id="sqlBtn">
                                    Generate SQL
                                </button>
                                
                                <button id="clearBtn">
                                    Clear
                                </button>

                                <button id="exportCorpusBtn">
                                    Export CKI Corpus
                                </button>

            </div>

            <div id="status" class="status"></div>

        </section>

        <section id="previewPanel" class="panel hidden">

            <h2>Preview</h2>

            <table class="preview-table">

                <tr>
                    <th>Logical title</th>
                    <td id="pvLogicalTitle"></td>
                </tr>

                <tr>
                    <th>Chat title</th>
                    <td id="pvChatTitle"></td>
                </tr>

                <tr>
                    <th>Conversation</th>
                    <td id="pvConversationStart"></td>
                </tr>

                <tr>
                    <th>Primary topic</th>
                    <td id="pvPrimaryTopic"></td>
                </tr>

                <tr>
                    <th>Systems</th>
                    <td id="pvSystems"></td>
                </tr>

            </table>

            <h3>Summary</h3>

            <div id="pvSummary" class="preview-text"></div>

            <h3>Retrieval Summary</h3>

            <div id="pvRetrievalSummary" class="preview-text"></div>

        </section>

<!-- ======================================================
CKI LIST
====================================================== -->

        <section id="listPanel" class="panel">

            <h2>CKI Lista</h2>

            <div id="ckiList">

                <div class="placeholder">

                    Még nincs betöltött adat.

                </div>

            </div>

        </section>


        <section id="sqlPanel" class="panel hidden">

            <h2>Generated SQL</h2>

            <textarea
                id="sqlOutput"
                readonly></textarea>

            <div class="button-row">

                <button id="copySqlBtn">
                    Copy SQL
                </button>

            </div>

        </section>

    </div>

            <script src="js/config.js?v=021"></script>
            <script src="js/parser.js?v=022"></script>
            <script src="js/preview.js?v=021"></script>
            <script src="js/sql.js?v=021"></script>
            <script src="js/supabase.js?v=021"></script>
            <script src="js/list.js"></script>
            <script src="js/cki_corpus_v1.js"></script>
            <script src="js/app.js?v=022"></script>

</body>

</html>
