<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAG - CKI Import</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>MAG</h1>
    <h2>CKI Import</h2>

    <textarea
        id="jsonInput"
        placeholder="Ide illeszd be a teljes CKI JSON-t..."></textarea>

    <div class="buttons">
        <button id="previewBtn">Preview</button>
        <button id="sqlBtn">Generate SQL</button>
    </div>

    <div id="status"></div>

    <div id="preview" class="card" style="display:none;">

        <h3>Preview</h3>

        <table>

            <tr>
                <td>Logical title</td>
                <td id="pLogical"></td>
            </tr>

            <tr>
                <td>Conversation</td>
                <td id="pDate"></td>
            </tr>

            <tr>
                <td>Primary topic</td>
                <td id="pPrimary"></td>
            </tr>

        </table>

        <h4>Summary</h4>
        <p id="pSummary"></p>

        <h4>Retrieval Summary</h4>
        <p id="pRetrieval"></p>

    </div>

    <div id="sqlCard" class="card" style="display:none;">

        <h3>Generated SQL</h3>

        <textarea id="sqlOutput" readonly></textarea>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
